name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install system packages
        run: sudo apt-get update && sudo apt-get install -y ninja-build clang libcurl4-openssl-dev pkg-config python3
      - uses: ocaml/setup-ocaml@v3
        with:
          ocaml-compiler: 5.5.x
      - name: Run compiler and end-to-end tests (epoll)
        run: opam exec -- ninja -j1 test
      - name: Test the relocated distribution and package catalog
        run: opam exec -- ninja -j1 dist_smoke ocpkg_catalog
      - name: Exercise the installed driver outside the checkout
        run: |
          opam exec -- env PREFIX="$RUNNER_TEMP/ocamlcc" ninja -j1 install
          opam exec -- sh tests/installed_driver.sh "$RUNNER_TEMP/ocamlcc/bin/occ"
      - name: Run ASan + UBSan runtime tests
        run: opam exec -- ninja asan_test

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install system packages
        run: brew install ninja coreutils
      - uses: ocaml/setup-ocaml@v3
        with:
          ocaml-compiler: 5.5.x
      - name: Run compiler and end-to-end tests (kqueue)
        run: opam exec -- ninja -j1 test
      - name: Test the relocated distribution and package catalog
        run: opam exec -- ninja -j1 dist_smoke ocpkg_catalog
      - name: Exercise the installed driver outside the checkout
        run: |
          opam exec -- env PREFIX="$RUNNER_TEMP/ocamlcc" ninja -j1 install
          opam exec -- sh tests/installed_driver.sh "$RUNNER_TEMP/ocamlcc/bin/occ"
      - name: Run ASan + UBSan runtime tests
        run: opam exec -- ninja asan_test
      - name: Exercise upstream stdlib and installed multi-module startup
        run: |
          opam exec -- ninja -j1 stdlib_compat
          opam exec -- sh tests/installed_driver.sh "$RUNNER_TEMP/ocamlcc/bin/occ" --stdlib-dir "$PWD/build/stdlib"
